name: CommandCenter
options:
  bundleIdPrefix: com.strategicnerds
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  CommandCenterCore:
    path: ../core

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 955GSY56UT
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  CommandCenter:
    type: application
    platform: macOS
    sources:
      - path: CommandCenter
    dependencies:
      - package: CommandCenterCore
        product: CommandCenterCore
      - target: CommandCenterExtension
        embed: true
    info:
      path: CommandCenter/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: "public.app-category.productivity"
        NSCalendarsUsageDescription: "Command Center shows your events on the new tab page."
        NSCalendarsFullAccessUsageDescription: "Command Center shows your events on the new tab page."
        CFBundleURLTypes:
          - CFBundleURLName: com.strategicnerds.commandcenter
            CFBundleURLSchemes:
              - commandcenter
    entitlements:
      path: CommandCenter/CommandCenter.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.strategicnerds.suite
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.strategicnerds.commandcenter
    settings:
      base:
        PRODUCT_NAME: CommandCenter
        PRODUCT_BUNDLE_IDENTIFIER: com.strategicnerds.commandcenter
        INFOPLIST_FILE: CommandCenter/Info.plist
        CODE_SIGN_ENTITLEMENTS: CommandCenter/CommandCenter.entitlements

  CommandCenterExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: CommandCenterExtension
    dependencies:
      - package: CommandCenterCore
        product: CommandCenterCore
    info:
      path: CommandCenterExtension/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: CommandCenterExtension/CommandCenterExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.strategicnerds.suite
    settings:
      base:
        PRODUCT_NAME: CommandCenterExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.strategicnerds.commandcenter.Extension
        PRODUCT_MODULE_NAME: CommandCenterExtension
        INFOPLIST_FILE: CommandCenterExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: CommandCenterExtension/CommandCenterExtension.entitlements
