name: CommandCenter
# XcodeGen spec for the Safari container app and its web-extension appex. The
# project is generated (never hand-edited or committed): `xcodegen generate`
# rebuilds CommandCenter.xcodeproj from this file, which release.sh runs before
# archiving. Mirrors the agent-server layout: Developer ID, hardened runtime, no
# sandbox, Sparkle for updates.

options:
  bundleIdPrefix: com.strategicnerds
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: 955GSY56UT
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    MARKETING_VERSION: "0.3.3"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.9"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
  CommandCenterAuth:
    path: CommandCenterAuth

targets:
  CommandCenter:
    type: application
    platform: macOS
    sources:
      - path: CommandCenter
    dependencies:
      - package: Sparkle
      - package: CommandCenterAuth
      - target: CommandCenterExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.strategicnerds.commandcenter
        PRODUCT_NAME: Command Center
        INFOPLIST_FILE: CommandCenter/Info.plist
        CODE_SIGN_ENTITLEMENTS: CommandCenter/CommandCenter.entitlements
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  CommandCenterExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: CommandCenterExtension/SafariWebExtensionHandler.swift
    dependencies:
      - package: CommandCenterAuth
    postCompileScripts:
      - name: Embed dashboard bundle
        # Builds dashboard/ with `pnpm build:safari` and copies the bundle
        # (manifest.json, newtab.html, assets) directly into the appex's
        # Contents/Resources, where Safari expects the manifest at the root. Runs
        # after compile and before code signing so the assets are signed with the
        # appex. basedOnDependencyAnalysis: false so it always runs (the dashboard
        # sources live outside this project).
        script: "${PROJECT_DIR}/scripts/embed-dashboard.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.strategicnerds.commandcenter.Extension
        PRODUCT_NAME: Command Center Extension
        INFOPLIST_FILE: CommandCenterExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: CommandCenterExtension/CommandCenterExtension.entitlements
        MACOSX_DEPLOYMENT_TARGET: "14.0"
